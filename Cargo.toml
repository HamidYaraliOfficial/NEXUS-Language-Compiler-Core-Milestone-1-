[workspace]
resolver = "2"
members = [
    "crates/diagnostics",
    "crates/lexer",
    "crates/ast",
    "crates/parser",
    "crates/typeck",
    "crates/interpreter",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NEXUS Language Project"]
license = "MIT"

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[profile.dev]
opt-level = 0
